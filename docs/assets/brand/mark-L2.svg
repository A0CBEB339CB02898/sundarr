<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sundarr · L2 — Opened S, upper and lower arcs cradle a sun

  Concept: 删掉 S 的中段对角线, 只留上下两段弧, 保留 S 的 180° 旋转
  对称笔势. 一颗带四道斜向光芒的太阳独立居中, 被上下两弧真正地
  "抱着". "太阳藏在两个弧之间" 视觉最强的版本.
  Canvas: 64×64, radius 14
  Colors driven by CSS custom properties:
    mark-bg: terracotta badge
    mark-fg: cream foreground
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Sundarr">
  <title>Sundarr</title>

  <!-- Badge 底色 -->
  <rect width="64" height="64" rx="14" ry="14" fill="var(--mark-bg, #d97642)"/>

  <!-- 上弧: 从右上到左中, S 上半笔势 -->
  <path d="M 46 18 C 46 11, 22 11, 20 22"
        stroke="var(--mark-fg, #f2ead8)" stroke-width="5" fill="none"
        stroke-linecap="round"/>

  <!-- 下弧: 180° 点对称, 从左下到右中 -->
  <path d="M 18 46 C 18 53, 42 53, 44 42"
        stroke="var(--mark-fg, #f2ead8)" stroke-width="5" fill="none"
        stroke-linecap="round"/>

  <!-- 太阳圆盘 -->
  <circle cx="32" cy="32" r="6.5" fill="var(--mark-fg, #f2ead8)"/>

  <!-- 四道 45°对角光芒 (避开上下弧) -->
  <g stroke="var(--mark-fg, #f2ead8)" stroke-width="2" stroke-linecap="round">
    <line x1="25.5" y1="25.5" x2="22.5" y2="22.5"/>
    <line x1="38.5" y1="38.5" x2="41.5" y2="41.5"/>
    <line x1="25.5" y1="38.5" x2="22.5" y2="41.5"/>
    <line x1="38.5" y1="25.5" x2="41.5" y2="22.5"/>
  </g>
</svg>
