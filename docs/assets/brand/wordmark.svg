<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sundarr Wordmark (Sundar · r)

  All-SVG wordmark. The geometry is frozen by the viewBox, so the
  layout is identical at every rendered size (14px to 960px).
  The middle dot is a real circle, never a typographic character.

  Font handling: Letters render via text elements with Inter fallback
  stack baked in. The "r dot r" placement uses absolute x coordinates
  so the dot is always on x-height midline and the right-r gap is
  always ~70% of the left-r gap. These do NOT drift with font size.

  For zero-font-dependency: run a one-time "text to path" conversion
  (Inkscape CLI or Puppeteer + PathKit) to freeze Inter glyphs into
  path outlines. See README for tooling notes.

  ViewBox:    0 0 350 100
  Baseline:   y = 72
  Font size:  70
  Font:       Inter / Medium

  Geometry of "r · r" cluster (absolute coords):
    Sundar textLength = 213 (ends at x = 221)
    dot: cx = 238, cy = 54, r = 7
    final r: x = 252
    ml gap = 10, mr gap = 7, mr/ml = 70%

  Coloring:
    currentColor drives letters (inherits from host CSS color)
    CSS var 'accent' drives the middle dot (falls back to currentColor)

  Host recipe:
    .wm-host     sets color = text, accent = accent
    .wm-host svg sets height = 1em, width = auto, inline-block

  Accessibility: role + aria-label + title announce "Sundarr".
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 350 100"
     role="img"
     aria-label="Sundarr"
     preserveAspectRatio="xMidYMid meet">
  <title>Sundarr</title>
  <style>
    .wm-text {
      font-family: "Inter", -apple-system, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 70px;
      letter-spacing: -1.2px;
      fill: currentColor;
    }
    .wm-dot {
      fill: var(--accent, currentColor);
    }
  </style>

  <!-- Main cluster "Sundar" -->
  <text class="wm-text" x="8" y="72" textLength="213" lengthAdjust="spacing">Sundar</text>

  <!-- Middle dot: x-height midline, sized ~20% of font size -->
  <circle class="wm-dot" cx="238" cy="54" r="7"/>

  <!-- Trailing "r" with optical compensation (mr ~70% of ml) -->
  <text class="wm-text" x="252" y="72">r</text>
</svg>
