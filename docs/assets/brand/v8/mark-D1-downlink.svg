<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sundarr · D1 — Downlink
  Scene: Cloud download into NAS, frozen as a static link.
  Punched layers: cloud (top) + down arrow (middle) + NAS bays (bottom)
  All three layers are negative space in the Sunday disc.
  Principle: subtract rather than add.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
     width="100" height="100" role="img" aria-label="Sundarr">
  <title>Sundarr · D1 Downlink</title>
  <defs>
    <mask id="downlink">
      <rect width="100" height="100" fill="white"/>
      <!-- Cloud (source) -->
      <g fill="black">
        <circle cx="41" cy="34" r="3.5"/>
        <circle cx="50" cy="31" r="4.5"/>
        <circle cx="59" cy="34" r="3.5"/>
        <rect x="41" y="34" width="18" height="4" rx="2"/>
      </g>
      <!-- Down arrow (transfer) -->
      <rect x="48.5" y="41" width="3" height="6" rx="1.5" fill="black"/>
      <path d="M 45 46 L 50 52 L 55 46"
            fill="none" stroke="black" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- NAS bays (destination) -->
      <g fill="black">
        <rect x="39" y="58" width="3" height="10" rx="1.5"/>
        <rect x="45.5" y="58" width="3" height="10" rx="1.5"/>
        <rect x="52" y="58" width="3" height="10" rx="1.5"/>
        <rect x="58.5" y="58" width="3" height="10" rx="1.5"/>
      </g>
    </mask>
  </defs>
  <rect width="100" height="100" rx="22" ry="22"
        fill="var(--mark-bg, #d97642)"/>
  <circle cx="50" cy="50" r="28"
          fill="var(--mark-fg, #f2ead8)"
          mask="url(#downlink)"/>
</svg>
