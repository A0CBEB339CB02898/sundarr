<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sundarr · D3 — Package
  Scene: A single file package captured mid-descent from cloud to NAS.
  The middle element is a small rounded square with an offset lid seam —
  a tangible "file" object rather than a generic arrow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
     width="100" height="100" role="img" aria-label="Sundarr">
  <title>Sundarr · D3 Package</title>
  <defs>
    <mask id="package">
      <rect width="100" height="100" fill="white"/>
      <!-- Cloud -->
      <g fill="black">
        <circle cx="41" cy="33" r="3.5"/>
        <circle cx="50" cy="30" r="4.5"/>
        <circle cx="59" cy="33" r="3.5"/>
        <rect x="41" y="33" width="18" height="4" rx="2"/>
      </g>
      <!-- A small file package, mid-fall (slightly right of center) -->
      <rect x="46" y="43" width="10" height="8" rx="1.5" fill="black"/>
      <!-- Package seam (keeps detail readable at scale) -->
      <rect x="46" y="46" width="10" height="1" fill="white"/>
      <!-- NAS bays -->
      <g fill="black">
        <rect x="39" y="58" width="3" height="10" rx="1.5"/>
        <rect x="45.5" y="58" width="3" height="10" rx="1.5"/>
        <rect x="52" y="58" width="3" height="10" rx="1.5"/>
        <rect x="58.5" y="58" width="3" height="10" rx="1.5"/>
      </g>
    </mask>
  </defs>
  <rect width="100" height="100" rx="22" ry="22"
        fill="var(--mark-bg, #d97642)"/>
  <circle cx="50" cy="50" r="28"
          fill="var(--mark-fg, #f2ead8)"
          mask="url(#package)"/>
</svg>
