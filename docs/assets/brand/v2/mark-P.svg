<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sundarr · P — Concentric Dot Emanation
  Pattern family: Dot Matrix (concentric ring)
  Story: Sunday = 起源/辐射. 12 外环点 + 6 内环点, 中心留空
  (太阳的缺席即其在场). 12 点暗合 12 时辰, 首尾两点略大
  隐喻 wordmark 的 r and r 书挡.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
     role="img" aria-label="Sundarr">
  <title>Sundarr · Concentric Dot Emanation</title>
  <g fill="currentColor">
    <!-- Inner ring: 6 dots, radius 14 from center -->
    <circle cx="50" cy="36" r="2.5"/>
    <circle cx="62.12" cy="43" r="2.5"/>
    <circle cx="62.12" cy="57" r="2.5"/>
    <circle cx="50" cy="64" r="2.5"/>
    <circle cx="37.88" cy="57" r="2.5"/>
    <circle cx="37.88" cy="43" r="2.5"/>

    <!-- Outer ring: 12 dots, radius 28 from center -->
    <!-- Top and bottom dots (12/6 o'clock) slightly larger as r and r bookends -->
    <circle cx="50" cy="22" r="3"/>
    <circle cx="64" cy="25.75" r="2"/>
    <circle cx="74.25" cy="36" r="2"/>
    <circle cx="78" cy="50" r="2"/>
    <circle cx="74.25" cy="64" r="2"/>
    <circle cx="64" cy="74.25" r="2"/>
    <circle cx="50" cy="78" r="3"/>
    <circle cx="36" cy="74.25" r="2"/>
    <circle cx="25.75" cy="64" r="2"/>
    <circle cx="22" cy="50" r="2"/>
    <circle cx="25.75" cy="36" r="2"/>
    <circle cx="36" cy="25.75" r="2"/>
  </g>
</svg>
