<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sundarr · W3-B — Cloud Cutout
  Derived from: W3 Punched Disc
  Extension: the punch IS a cloud silhouette. A Sunday sun
  with a cloud-shaped absence in it — cloud storage.
  Principle kept: subtract rather than add; rounded cutouts.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
     width="100" height="100" role="img" aria-label="Sundarr">
  <title>Sundarr · W3-B Cloud Cutout</title>
  <defs>
    <mask id="cloud">
      <rect width="100" height="100" fill="white"/>
      <g fill="black">
        <circle cx="41" cy="53" r="5"/>
        <circle cx="49" cy="47" r="7"/>
        <circle cx="59" cy="52" r="5.5"/>
        <rect x="41" y="53" width="18" height="6" rx="3"/>
      </g>
    </mask>
  </defs>
  <rect width="100" height="100" rx="22" ry="22"
        fill="var(--mark-bg, #d97642)"/>
  <circle cx="50" cy="50" r="28"
          fill="var(--mark-fg, #f2ead8)"
          mask="url(#cloud)"/>
</svg>
