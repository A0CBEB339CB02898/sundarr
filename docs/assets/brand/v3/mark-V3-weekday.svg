<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sundarr · V3 — Weekday
  Concept: Sunday x Media x Arr (三合一)
  Story: 6 根竖刻度 = 周一到周六, 平淡的日常;
  第 7 位 = 一颗带光芒的太阳 = Sunday, 媒体消费的绽放.
  也像 media library 目录里最后一行的高亮 = Arr 自动化的产出.
  Asymmetric by design: 左侧克制, 右侧绽放.
  Canvas: 64x64, radius 14.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Sundarr">
  <title>Sundarr · Weekday</title>

  <!-- Badge base -->
  <rect width="64" height="64" rx="14" ry="14" fill="var(--mark-bg, #d97642)"/>

  <!-- Weekdays Mon..Sat: 6 short vertical ticks, muted -->
  <g stroke="var(--mark-fg, #f2ead8)" stroke-width="2.5"
     stroke-linecap="round" opacity="0.55">
    <line x1="12" y1="28" x2="12" y2="36"/>
    <line x1="18" y1="28" x2="18" y2="36"/>
    <line x1="24" y1="28" x2="24" y2="36"/>
    <line x1="30" y1="28" x2="30" y2="36"/>
    <line x1="36" y1="28" x2="36" y2="36"/>
    <line x1="42" y1="28" x2="42" y2="36"/>
  </g>

  <!-- Sunday: a sun with rays, solid, full opacity -->
  <circle cx="52" cy="32" r="5" fill="var(--mark-fg, #f2ead8)"/>
  <g stroke="var(--mark-fg, #f2ead8)" stroke-width="1.6"
     stroke-linecap="round">
    <line x1="52" y1="23" x2="52" y2="20"/>
    <line x1="52" y1="41" x2="52" y2="44"/>
    <line x1="58.5" y1="25.5" x2="60.5" y2="23.5"/>
    <line x1="45.5" y1="25.5" x2="43.5" y2="23.5"/>
    <line x1="58.5" y1="38.5" x2="60.5" y2="40.5"/>
    <line x1="45.5" y1="38.5" x2="43.5" y2="40.5"/>
  </g>
</svg>
