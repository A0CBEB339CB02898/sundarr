<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sundarr · Monochrome Mark
  =========================
  CurrentColor-driven optical variant of the primary mark, for:
    - Print on single-ink presses
    - Engraving / watermark / foil stamp
    - Reversed contexts where badge background must match carrier
      (e.g., the mark appearing on a terracotta surface itself)
  Badge and punches use currentColor so the host can color it via CSS:
    color: var(text);            light on dark
    color: var(mark-bg);         on cream cards
    color: var(mark-fg);         on terracotta surfaces (reversed)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
     width="100" height="100" role="img" aria-label="Sundarr">
  <title>Sundarr</title>
  <rect width="100" height="100" rx="22" ry="22" fill="currentColor"/>
  <circle cx="50" cy="50" r="28" fill="Canvas"/>
  <circle cx="40" cy="38" r="7" fill="currentColor"/>
  <circle cx="54" cy="42" r="4.5" fill="currentColor"/>
  <circle cx="38" cy="56" r="4.5" fill="currentColor"/>
  <circle cx="58" cy="60" r="5.5" fill="currentColor"/>
</svg>
