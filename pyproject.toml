[project]
name = "sundarr"
version = "0.1.0"
description = "Personal cloud media search, staging, and NAS archive automation."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.2.0",
  "smbprotocol>=1.15.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.scripts]
sundarr = "sundarr.app.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.0",
  "ruff>=0.16.6,<0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".sundarr/pytest-cache"
markers = [
  "postgres_integration: 需要显式 PostgreSQL 地址并创建一次性测试数据库",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# 首个静态检查门只阻断语法、未定义名称、重复定义和无效导入；风格规则分阶段启用。
select = ["E9", "F"]
