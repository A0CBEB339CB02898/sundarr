[project]
name = "sundarr"
version = "0.1.0"
description = "Personal cloud media search, staging, and NAS archive automation."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.2.0",
  "smbprotocol>=1.15.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.scripts]
sundarr = "sundarr.app.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".sundarr/pytest-cache"
