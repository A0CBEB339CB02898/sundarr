services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sundarr
      POSTGRES_USER: sundarr
      POSTGRES_PASSWORD: ${SUNDARR_POSTGRES_PASSWORD:-sundarr}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sundarr -d sundarr"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine

  sundarr-migrate:
    build:
      context: .
    environment:
      SUNDARR_DATABASE_URL: postgresql+psycopg://sundarr:${SUNDARR_POSTGRES_PASSWORD:-sundarr}@postgres:5432/sundarr
      SUNDARR_REDIS_URL: redis://redis:6379/0
      SUNDARR_LOG_TO_FILE: "false"
      SUNDARR_PLUGIN_CONFIG_KEY: ${SUNDARR_PLUGIN_CONFIG_KEY:-}
    volumes:
      - runtime-data:/app/.sundarr
    command: ["sundarr", "init-db"]
    depends_on:
      postgres:
        condition: service_healthy

  sundarr-api:
    build:
      context: .
    environment:
      SUNDARR_DATABASE_URL: postgresql+psycopg://sundarr:${SUNDARR_POSTGRES_PASSWORD:-sundarr}@postgres:5432/sundarr
      SUNDARR_REDIS_URL: redis://redis:6379/0
      SUNDARR_LOG_TO_FILE: "false"
      SUNDARR_PLUGIN_CONFIG_KEY: ${SUNDARR_PLUGIN_CONFIG_KEY:-}
    volumes:
      - runtime-data:/app/.sundarr
    depends_on:
      sundarr-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sundarr-worker:
    build:
      context: .
    environment:
      SUNDARR_DATABASE_URL: postgresql+psycopg://sundarr:${SUNDARR_POSTGRES_PASSWORD:-sundarr}@postgres:5432/sundarr
      SUNDARR_REDIS_URL: redis://redis:6379/0
      SUNDARR_LOG_TO_FILE: "false"
      SUNDARR_PLUGIN_CONFIG_KEY: ${SUNDARR_PLUGIN_CONFIG_KEY:-}
    command: ["python", "-m", "sundarr.app.worker"]
    volumes:
      - runtime-data:/app/.sundarr
    depends_on:
      sundarr-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sundarr-web:
    build:
      context: ./web
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://sundarr-api:8080
    ports:
      - "127.0.0.1:${SUNDARR_WEB_PORT:-5173}:5173"
    depends_on:
      - sundarr-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  runtime-data:
