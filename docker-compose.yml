services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sundarr
      POSTGRES_USER: sundarr
      POSTGRES_PASSWORD: sundarr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  sundarr-api:
    build:
      context: .
    environment:
      SUNDARR_DATABASE_URL: postgresql+psycopg://sundarr:sundarr@postgres:5432/sundarr
      SUNDARR_REDIS_URL: redis://redis:6379/0
      SUNDARR_LOG_TO_FILE: "false"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sundarr-worker:
    build:
      context: .
    environment:
      SUNDARR_DATABASE_URL: postgresql+psycopg://sundarr:sundarr@postgres:5432/sundarr
      SUNDARR_REDIS_URL: redis://redis:6379/0
      SUNDARR_LOG_TO_FILE: "false"
    command: ["python", "-m", "sundarr.app.worker"]
    depends_on:
      - postgres
      - redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sundarr-web:
    build:
      context: ./web
      target: dev
    ports:
      - "5173:5173"
    depends_on:
      - sundarr-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
